<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PolicyPal AI</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Sora',sans-serif;
  background:#0f1117;
  color:#e6e6e6;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  border-bottom:1px solid #222;
}

.brand{
  font-size:20px;
  font-weight:600;
}

.tagline{
  font-size:12px;
  color:#888;
}

.badge{
  background:#2b2f3a;
  padding:6px 14px;
  border-radius:20px;
  font-size:11px;
}

/* CENTER HERO */
.hero{
  text-align:center;
  margin-top:80px;
}

.hero h1{
  font-size:38px;
  font-weight:500;
}

.hero p{
  margin-top:10px;
  color:#aaa;
  font-size:14px;
}

/* INPUT */
.input-box{
  max-width:700px;
  margin:40px auto;
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:14px;
  border-radius:30px;
  border:1px solid #333;
  background:#1a1d25;
  color:white;
}

button{
  padding:14px 18px;
  border-radius:30px;
  border:none;
  background:#5b7cff;
  color:white;
  cursor:pointer;
}

/* RESULTS */
.results{
  max-width:900px;
  margin:30px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:#1a1d25;
  padding:18px;
  border-radius:14px;
}

.card h3{
  margin-bottom:10px;
  font-size:14px;
}

.card-text{
  white-space:pre-wrap;
  line-height:1.6;
}

.sources{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.source{
  background:#2a2f3a;
  padding:4px 8px;
  font-size:11px;
  border-radius:6px;
}
</style>

</head>

<body>

<div class="header">
  <div>
    <div class="brand">PolicyPal AI</div>
    <div class="tagline">Indian Acts in Plain Language</div>
  </div>
  <div class="badge">RAG + Fine-tuned</div>
</div>

<div class="hero">
  <h1>Ask about Indian Acts</h1>
  <p>GST, IT Act, Consumer Act, Essential Commodities</p>
</div>

<div class="input-box">
  <input id="query-input" placeholder="Ask your question..." />
  <button onclick="runQuery()">Ask</button>
</div>

<div class="results">

  <div class="card">
    <h3>Baseline (No RAG)</h3>
    <div id="baseline-text">---</div>
  </div>

  <div class="card">
    <h3>AI Answer (RAG + Fine-tuned)</h3>
    <div id="finetuned-text">---</div>
    <div id="sources" class="sources" style="display:none"></div>
  </div>

</div>

<script>

let running = false;

/* ✅ DOMAIN FILTER */
function isAllowed(q){
  q = q.toLowerCase();

  return (
    q.includes("gst") ||
    q.includes("tax") ||
    q.includes("income tax") ||
    q.includes("it act") ||
    q.includes("information technology") ||
    q.includes("consumer") ||
    q.includes("essential commodities")
  );
}

async function runQuery(){

  if(running) return;

  const q = document.getElementById('query-input').value.trim();
  if(!q) return;

  running = true;

  document.getElementById('baseline-text').innerText = "Loading...";
  document.getElementById('finetuned-text').innerText = "Generating...";

  /* ❌ OUT OF SCOPE */
  if(!isAllowed(q)){
    const msg = "This query is currently outside the supported scope (GST, IT Act, Consumer Act, Essential Commodities). Future updates will include more policies.";

    document.getElementById('baseline-text').innerText = msg;
    document.getElementById('finetuned-text').innerText = msg;

    running = false;
    return;
  }

  try{

    /* BASELINE */
    const base = await fetch("http://127.0.0.1:8000/baseline",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });

    const b = await base.json();
    document.getElementById('baseline-text').innerText = b.answer;

    /* RAG */
    const rag = await fetch("http://127.0.0.1:8000/query",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q, top_k:3})
    });

    const r = await rag.json();

    document.getElementById('finetuned-text').innerText = r.answer;

    const s = document.getElementById('sources');
    s.innerHTML = r.sources.map(x => `<span class="source">${x.title}</span>`).join('');
    s.style.display = "flex";

  }catch(e){
    document.getElementById('finetuned-text').innerText = "Backend error";
  }

  running = false;
}

document.getElementById('query-input').addEventListener('keydown',e=>{
  if(e.key==="Enter") runQuery();
});

</script>

</body>
</html>
